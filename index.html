<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CDR Vasco da Gama</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#050505;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER / MENU PRINCIPAL
========================= */

header{
  height:92px;
  background:#050505;
  display:flex;
  align-items:center;
  padding:0 40px;
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.header-left{
  display:flex;
  align-items:center;
  gap:15px;
  flex-shrink:0;
}

.header-left img{
  width:58px;
  height:58px;
  object-fit:contain;
}

.club-name{
  display:flex;
  flex-direction:column;
  line-height:1;
}

.club-name strong{
  font-size:20px;
  letter-spacing:2px;
  font-weight:800;
}

.club-name span{
  margin-top:7px;
  font-size:10px;
  letter-spacing:2.5px;
  color:#aaa;
}

nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:34px;
}

nav a{
  position:relative;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
  letter-spacing:1.5px;
  padding:10px 0;
  transition:.25s ease;
}

nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:2px;
  background:#e00000;
  transition:.25s ease;
}

nav a:hover{
  color:#e00000;
}

nav a:hover::after{
  width:100%;
}

nav a.active{
  color:#e00000;
}

nav a.active::after{
  width:100%;
}

/* =========================
   HERO
========================= */

.hero{
  height:calc(100vh - 92px);
  min-height:650px;
  position:relative;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;

  background:
    url("fundohome.png")
    center center / cover
    no-repeat;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      transparent 45%,
      rgba(5,5,5,.15) 58%,
      rgba(5,5,5,.55) 75%,
      #050505 100%
    ),
    linear-gradient(
      to right,
      rgba(0,0,0,.30) 0%,
      transparent 18%,
      transparent 82%,
      rgba(0,0,0,.30) 100%
    );

  pointer-events:none;
}

/* =========================
   FOOTER
========================= */

footer{
  background:#050505;
  border-top:1px solid rgba(255,255,255,.08);
  padding:30px 20px;
  text-align:center;
  color:#777;
  font-size:12px;
  letter-spacing:1px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  header{
    height:auto;
    min-height:92px;
    padding:15px 20px;
    flex-wrap:wrap;
    gap:15px;
  }

  .header-left{
    width:100%;
    justify-content:center;
  }

  nav{
    width:100%;
    margin:0;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
  }

  nav a{
    font-size:11px;
    letter-spacing:1px;
  }

  .hero{
    height:calc(100vh - 140px);
    min-height:550px;
  }
}

@media(max-width:600px){

  header{
    padding:12px 10px;
  }

  .header-left img{
    width:48px;
    height:48px;
  }

  .club-name strong{
    font-size:16px;
  }

  .club-name span{
    font-size:8px;
    letter-spacing:2px;
  }

  nav{
    gap:12px;
  }

  nav a{
    font-size:10px;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-left">

    <img src="cdrvg.png" alt="CDR Vasco da Gama">

    <div class="club-name">
      <strong>CDR VASCO DA GAMA</strong>
      <span>CLUBE DESPORTIVO E RECREATIVO</span>
    </div>

  </div>

  <nav>

    <a href="index.html" class="active">
      HOME
    </a>

    <a href="historia.html">
      HISTÓRIA
    </a>

    <a href="loja.html">
      LOJA
    </a>

    <a href="#">
      CALENDÁRIO
    </a>

    <a href="#">
      SÓCIOS
    </a>

  </nav>

</header>

<main>

  <section class="hero"></section>

</main>

<footer>
  © CDR VASCO DA GAMA — TODOS OS DIREITOS RESERVADOS
</footer>

</body>
</html>
